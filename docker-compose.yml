name: collab-board

x-database: &database
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_DB: ${POSTGRES_DB:-collab_board}

services:
  postgres:
    image: postgres:16.8-alpine3.21
    restart: unless-stopped
    environment: *database
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrator
    environment: &api-database
      <<: *database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api
    environment: *api-database
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/api/v1/health').then(async (response) => {
            const { status, database } = await response.json();
            if (response.status !== 200 || status !== 'ok' || database !== 'connected') process.exit(1);
          }).catch(() => process.exit(1));
      interval: 2s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: web
      args:
        API_INTERNAL_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
